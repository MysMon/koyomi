# Dependabot の設定。
# pnpm ワークスペース全体（ルートの pnpm-lock.yaml）と GitHub Actions を対象にする。
version: 2
updates:
  # npm 依存（pnpm ワークスペース全体をルートのロックファイル経由で更新する）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      # minor / patch は 1 本の PR にまとめてノイズを減らす。
      # major は破壊的変更の確認が必要なため依存ごとに個別 PR にする
      # （例: @date-fns/tz は更新時にタイムゾーンキャッシュ挙動の再確認が必要）。
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 系（ネイティブ実装）は tsup の dts 生成
      # （rollup-plugin-dts が typescript ^4.5 || ^5 || ^6 のみ対応）が
      # 未対応のためビルド不能。ツールチェーン対応後に手動で更新する。
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    # 公開直後のバージョンを取り込まない待機期間（サプライチェーン対策）。
    # 依存の乗っ取りによる悪性バージョンは公開から発覚まで数時間〜数日が典型のため、
    # 14 日置いてから更新 PR を作る。脆弱性対応（security update）はこの待機の対象外
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10

  # GitHub Actions（.github/workflows/ 配下の uses: を更新する）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
    # npm 依存と同趣旨の待機期間（action の uses: は commit SHA でピン留めしているため、
    # 更新はこの Dependabot PR 経由でのみ行われる）
    cooldown:
      default-days: 7
