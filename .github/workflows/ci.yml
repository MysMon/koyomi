# CI: Lint（Biome）・型チェック（tsc）・テスト（Vitest）・ビルド（tsup）を実行する
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: Lint（Biome）
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト
        run: pnpm test

      - name: ビルド
        run: pnpm build
