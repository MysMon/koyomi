# CI: 静的検査・テスト・ビルド/パッケージ検査・実ブラウザ E2E・性能リグレッション検出を
# 独立したジョブとして並行実行する。
# Node の互換性はテストジョブの matrix で下限（20.19.0）と最新 LTS（24）の 2 レグで検証する。
# それ以外のジョブはサポート下限の Node 20.19.0 で実行し、ツールチェーンが下限で動くことを保証する。
# サプライチェーン対策として action は commit SHA でピン留めし、トークン権限は読み取りのみに絞る。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一ブランチへの連続 push では古い実行をキャンセルする（main への push は全実行を保持）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static-checks:
    name: 静的検査（Lint・型・用語・対応関係）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: 用語チェック
        run: pnpm terms

      - name: 実装・テスト対応チェック
        run: pnpm test:pairs

      - name: ドキュメント英訳対応チェック
        run: pnpm docs:en-pairs

      - name: Lint（Biome）
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

  test:
    name: テスト（Node ${{ matrix.node-version }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 下限レグはカバレッジ計測を兼ねる（計測は 1 レグで十分なため）
          - node-version: 20.19.0
            coverage: true
          - node-version: 24
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: テスト（カバレッジ付き）
        if: matrix.coverage
        run: pnpm --filter @koyomi-cal/react test:coverage

      - name: テスト
        if: ${{ !matrix.coverage }}
        run: pnpm --filter @koyomi-cal/react test

  package:
    name: ビルド・パッケージ検査
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: ビルド（tsup）
        run: pnpm build

      # ビルド済み dist を利用側の立場でバンドルし、tree-shaking の実効性
      # （未使用ビューの除外・ライブラリ寄与分の gzip サイズ閾値）を検証する
      - name: バンドルサイズ検証
        run: pnpm bundle:check

      - name: パッケージ検査（publint / arethetypeswrong）
        working-directory: packages/react-calendar
        run: |
          pnpm exec publint
          # ESM-only パッケージのため esm-only プロファイル。theme.css は型解決対象外なので除外
          pnpm exec attw --pack . --profile esm-only --exclude-entrypoints ./theme.css

      - name: pack スモークテスト（素の Node ESM/CJS から公開物を読み込めるか）
        run: bash scripts/pack-smoke-test.sh

  examples:
    name: サンプル検証（${{ matrix.example }}）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [vite-minimal, nextjs-app-router]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: ビルド（tsup）
        run: pnpm build

      # examples はワークスペース外の独立プロジェクトのため、公開時と同じ tarball を
      # npm で差し込んでビルドし、公開物がそのまま利用側で使えることを検証する
      - name: 公開物 tarball の作成
        working-directory: packages/react-calendar
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: サンプルのビルド（tarball 差し替え）
        working-directory: examples/${{ matrix.example }}
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/koyomi-cal-react-*.tgz
          npm run build

  e2e:
    name: 実ブラウザ E2E（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      # E2E は開発サーバー（ソース直接参照）で動くため dist ビルドは不要だが、
      # デモの本番ビルドが通ること自体はここで検証する
      - name: デモのビルド
        run: pnpm --filter @koyomi-cal/demo build

      - name: Playwright ブラウザのインストール
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: 実ブラウザ E2E
        run: pnpm test:e2e

  bench:
    name: 性能リグレッション検出
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      # ベンチはデモの本番ビルド + preview 配信（bench:serve）で Chromium のみ実行する
      - name: Playwright ブラウザのインストール（Chromium のみ）
        run: pnpm exec playwright install --with-deps chromium

      # 意図的に粗い閾値（手元実測の約 10 倍）との比較のみ行い、ランナーの
      # 速度差・負荷変動で flaky にならない範囲で、計算量が悪化するような
      # 明確な性能リグレッションだけを検出する（bench/regression.spec.ts）
      - name: 性能リグレッション検出（粗い閾値）
        run: pnpm bench:ci
