# CI: Lint（Biome）・型チェック（tsc）・テスト（Vitest・カバレッジ付き）・ビルド（tsup）
# ・パッケージ検査（publint / attw / pack スモークテスト）を実行する
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: Lint（Biome）
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト（カバレッジ付き）
        run: pnpm --filter @koyomi-cal/react test:coverage

      - name: ビルド
        run: pnpm build

      - name: パッケージ検査（publint / arethetypeswrong）
        working-directory: packages/react-calendar
        run: |
          pnpm dlx publint
          # ESM-only パッケージのため esm-only プロファイル。theme.css は型解決対象外なので除外
          pnpm dlx @arethetypeswrong/cli --pack . --profile esm-only --exclude-entrypoints ./theme.css

      - name: pack スモークテスト（素の Node ESM から公開物を import できるか）
        run: |
          set -eu
          PKG_DIR="$(pwd)/packages/react-calendar"
          TARBALL="$(cd "$PKG_DIR" && npm pack --pack-destination /tmp | tail -1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          npm install --no-save "/tmp/$TARBALL" react react-dom > /dev/null
          node --input-type=module -e "
            import('@koyomi-cal/react').then((m) => {
              const cal = m.createCalendar({
                timeZone: 'Asia/Tokyo',
                events: [{ id: '1', title: 't', start: '2026-07-01T10:00', rrule: 'FREQ=DAILY;COUNT=3' }],
              });
              const count = cal.getOccurrences({
                start: new Date('2026-06-30T00:00:00Z'),
                end: new Date('2026-07-10T00:00:00Z'),
              }).length;
              if (count !== 3) throw new Error('RRULE 展開が期待どおりでない: ' + count);
              console.log('スモークテスト OK');
            });
          "
