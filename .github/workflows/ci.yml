# CI: Lint（Biome）・型チェック（tsc）・テスト（Vitest・カバレッジ付き）・ビルド（tsup）
# ・パッケージ検査（publint / attw / pack スモークテスト）を実行する。
# Node / React の互換性を確認するため、主レグに加えて Node 24、React 18 の
# 組み合わせを追加の 2 レグで検証する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: main
            node-version: 20.19.0
            react-version: 19
          - id: node24-react19
            node-version: 24
            react-version: 19
          - id: node24-react18
            node-version: 24
            react-version: 18
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: React 18 への差し替え（node24-react18 レグのみ）
        if: matrix.id == 'node24-react18'
        run: |
          pnpm --filter @koyomi-cal/react add -D react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18

      - name: 用語チェック（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm terms

      - name: Lint（Biome）（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm lint

      # React 18 レグはライブラリの @types/react だけを 18 へ差し替えるため、
      # React 19 のままのデモを含めると型定義が混在して検査にならない。
      # このレグの検査対象はライブラリのみとする。
      - name: 型チェック
        if: matrix.id != 'node24-react18'
        run: pnpm typecheck

      - name: 型チェック（ライブラリのみ、node24-react18 レグ）
        if: matrix.id == 'node24-react18'
        run: pnpm --filter @koyomi-cal/react typecheck

      - name: テスト（カバレッジ付き、main レグのみ）
        if: matrix.id == 'main'
        run: pnpm --filter @koyomi-cal/react test:coverage

      - name: テスト（main レグ以外）
        if: matrix.id != 'main'
        run: pnpm --filter @koyomi-cal/react test

      - name: ビルド（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm build

      - name: デモのビルド（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm --filter @koyomi-cal/demo build

      - name: パッケージ検査（publint / arethetypeswrong、main レグのみ）
        if: matrix.id == 'main'
        working-directory: packages/react-calendar
        run: |
          pnpm dlx publint@0.3.15
          # ESM-only パッケージのため esm-only プロファイル。theme.css は型解決対象外なので除外
          pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only --exclude-entrypoints ./theme.css

      - name: pack スモークテスト（素の Node ESM/CJS から公開物を読み込めるか、main レグのみ）
        if: matrix.id == 'main'
        run: bash scripts/pack-smoke-test.sh
