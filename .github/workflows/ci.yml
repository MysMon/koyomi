# CI: Lint（Biome）・型チェック（tsc）・テスト（Vitest・カバレッジ付き）・ビルド（tsup）
# ・実ブラウザ E2E（Playwright）・パッケージ検査（publint / attw / pack スモークテスト）を実行する。
# Node の互換性を確認するため、下限（20.19.0）と最新 LTS（24）の 2 レグで検証する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: main
            node-version: 20.19.0
          - id: node24
            node-version: 24
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile

      - name: 用語チェック（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm terms

      - name: 実装・テスト対応チェック（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm test:pairs

      - name: Lint（Biome）（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト（カバレッジ付き、main レグのみ）
        if: matrix.id == 'main'
        run: pnpm --filter @koyomi-cal/react test:coverage

      - name: テスト（main レグ以外）
        if: matrix.id != 'main'
        run: pnpm --filter @koyomi-cal/react test

      - name: ビルド（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm build

      - name: デモのビルド（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm --filter @koyomi-cal/demo build

      - name: Playwright ブラウザのインストール（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: 実ブラウザ E2E（main レグのみ）
        if: matrix.id == 'main'
        run: pnpm test:e2e

      - name: パッケージ検査（publint / arethetypeswrong、main レグのみ）
        if: matrix.id == 'main'
        working-directory: packages/react-calendar
        run: |
          pnpm dlx publint@0.3.15
          # ESM-only パッケージのため esm-only プロファイル。theme.css は型解決対象外なので除外
          pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only --exclude-entrypoints ./theme.css

      - name: pack スモークテスト（素の Node ESM/CJS から公開物を読み込めるか、main レグのみ）
        if: matrix.id == 'main'
        run: bash scripts/pack-smoke-test.sh
